let state = load();

function load() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return structuredClone(DEFAULT_STATE);
    const parsed = JSON.parse(raw);
    return { ...structuredClone(DEFAULT_STATE), ...parsed };
  } catch(e) { return structuredClone(DEFAULT_STATE); }
}
function save() { localStorage.setItem(LS_KEY, JSON.stringify(state)); }

   ============================================================== */
function pad(n) { return n<10?'0'+n:''+n; }
function fmtDate(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function today() { return fmtDate(new Date()); }
function daysBetween(a, b) { return Math.round((new Date(b) - new Date(a)) / 86400000); }
function todayStr() {
  const d = new Date();
  const w = ['日','一','二','三','四','五','六'][d.getDay()];
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 · 周${w}`;
}

function maxStreak(s) {
  const dates = Object.keys(s.weights).sort();
  if (dates.length === 0) return 0;
  let maxN = 1, curN = 1;
  for (let i = 1; i < dates.length; i++) {
    if (daysBetween(dates[i-1], dates[i]) === 1) { curN++; maxN = Math.max(maxN, curN); }
    else curN = 1;
  }
  return maxN;
}
function proteinHitDays(s) {
  let n = 0;
  Object.values(s.diet||{}).forEach(d => {
    if (!d) return;
    let p = 0;
    ['breakfast','lunch','dinner','snack'].forEach(k => (d[k]||[]).forEach(it => p += Number(it.p||0)));
    if (p >= USER_PROFILE.proteinMin) n++;
  });
  return n;
}

function currentWeight(s = state) {
  const dates = Object.keys(s.weights || {}).sort();

}
function firstWeight(s = state) {
  const dates = Object.keys(s.weights || {}).sort();

}
function bmi() {
  // 体重是斤，转 kg
  const kg = currentWeight() / 2;
  const m = USER_PROFILE.height / 100;
  return kg / (m*m);
}
function bmiLabel(v) {
  if (v < 18.5) return { label:'偏瘦', color:'text-sky-500' };
  if (v < 24)   return { label:'正常', color:'text-mint-600' };
  if (v < 28)   return { label:'超重', color:'text-amber-500' };
  return { label:'肥胖', color:'text-red-500' };
}

function dietOfDay(date) {
  const raw = state.diet[date];
  if (!raw) return { breakfast:[], lunch:[], dinner:[], snack:[] };
  return { breakfast:[], lunch:[], dinner:[], snack:[], ...raw };
}
function macrosOfDay(date) {
  const d = dietOfDay(date);
  let k=0, p=0, c=0, f=0;
  ['breakfast','lunch','dinner','snack'].forEach(m => (d[m]||[]).forEach(it => {
    k += Number(it.kcal||it.k||0);
    p += Number(it.p||0);
    c += Number(it.c||0);
    f += Number(it.f||0);
  }));
  return { k, p, c, f };
}
function exerciseKcal(date) {
  return (state.exercise[date]||[]).reduce((a,b)=>a+Number(b.kcal||0),0);
}
function balanceKcal(date) {
  // 净热量 = 食物+饮品 - 运动
  return macrosOfDay(date).k + drinkKcal(date) - exerciseKcal(date);
}
// 纯水摄入量（ml），优先从 drinks 汇总 water=true 项，兼容 legacy state.water
function waterMl(date) {
  const list = state.drinks[date];
  if (list && list.length) {
    return list.filter(d => d.water).reduce((a,b) => a + Number(b.ml||0), 0);
  }
  return state.water[date] || 0;
}
function drinkKcal(date) {
  return (state.drinks[date] || []).reduce((a,b) => a + Number(b.kcal||0), 0);
}
function drinkCaffeine(date) {
  return (state.drinks[date] || []).filter(d => d.caffeine).length;
}

/* ==============================================================
   经期 / 生理周期
   ============================================================== */
function getCyclePhase(date) {
  date = date || today();
  const periods = (state.periods || []).slice().sort((a,b) => a.start.localeCompare(b.start));
  if (periods.length === 0) return { phase:'unknown', label:'未记录', day:0 };
  // 是否在某个经期区间内
  for (const p of periods) {
    if (date >= p.start && date <= p.end) {
      const day = daysBetween(p.start, date) + 1;
      return { phase:'menstrual', label:'经期', day, period:p };
    }
  }
  // 找最后一个已结束的经期
  const past = periods.filter(p => p.end < date);
  if (past.length === 0) return { phase:'unknown', label:'未开始', day:0 };
  const last = past[past.length - 1];
  const offset = daysBetween(last.end, date); // 距经期结束
  const avgCycle = (state.settings && state.settings.avgCycle) || 28;
  const avgPeriod = (state.settings && state.settings.avgPeriod) || 5;
  const nextEstimate = avgCycle - avgPeriod;
  if (offset >= 1 && offset <= 7) return { phase:'follicular', label:'卵泡期', day:offset };
  if (offset >= 8 && offset <= 14) return { phase:'ovulation', label:'排卵期', day:offset };
  if (offset >= 15 && offset < nextEstimate + 3) return { phase:'luteal', label:'黄体期', day:offset };
  return { phase:'unknown', label:'周期外', day:offset };
}
function getCalorieTarget() {
  // 返回当前热量上限（根据周期动态调整）
  const phase = getCyclePhase();
  let max = USER_PROFILE.calorieMax;
  if (phase.phase === 'menstrual') max = 1650;
  else if (phase.phase === 'luteal') max = 1550;
  return { min: USER_PROFILE.calorieMin, max, phase };
}
function cyclePhaseTip(phase) {
  if (phase.phase === 'menstrual')
    return { icon:'💕', text:`经期第 ${phase.day} 天，多喝热水，适当放松饮食压力，热量目标已自动上浮 150kcal。补铁食物：牛肉/鸭血/深绿蔬菜/豆类。`, cls:'from-pink-50 to-rose-50 border-pink-100 text-pink-700' };
  if (phase.phase === 'luteal')
    return { icon:'🌸', text:'黄体期，可能会有食欲增加/水肿，多吃点镁（坚果/深绿蔬菜）；热量目标微上浮 50kcal。', cls:'from-purple-50 to-fuchsia-50 border-purple-100 text-purple-700' };
  if (phase.phase === 'follicular')
    return { icon:'✨', text:'卵泡期，激素回升、代谢较好，可以适当加强运动强度。', cls:'from-emerald-50 to-teal-50 border-emerald-100 text-emerald-700' };
  if (phase.phase === 'ovulation')
    return { icon:'✨', text:'排卵期，能量最好的一段时间，正是冲刺运动/减脂的好窗口。', cls:'from-sky-50 to-cyan-50 border-sky-100 text-sky-700' };
  return null;
}

function streakDays() {
  let n = 0;
  const d = new Date();
  while (true) {
    const key = fmtDate(d);
    if (state.weights[key] != null) { n++; d.setDate(d.getDate()-1); }
    else break;
  }
  return n;
}
function daysToGoal() {
  const now = currentWeight();
  const remain = now - USER_PROFILE.goalWeight;
  if (remain <= 0) return 0;
  const dates = Object.keys(state.weights).sort();
  if (dates.length < 2) return Math.ceil(remain / 0.178);
  const last = state.weights[dates[dates.length-1]];
  const startIdx = Math.max(0, dates.length - 8);
  const base = state.weights[dates[startIdx]];
  const spanDays = daysBetween(dates[startIdx], dates[dates.length-1]) || 1;
  const rate = (base - last) / spanDays;
  if (rate <= 0.02) return Math.ceil(remain / 0.178);
  return Math.ceil(remain / rate);
}
function predictedDate() {
  const days = daysToGoal();
  const d = new Date();
  d.setDate(d.getDate() + days);
  return fmtDate(d);
}
function planEta() {
  const now = currentWeight();
  const start = USER_PROFILE.startWeight;
  const goal = USER_PROFILE.goalWeight;
  const totalLoss = start - goal;
  const done = Math.max(0, start - now);
  const pct = Math.max(0, Math.min(100, (done / totalLoss) * 100));
  return { pct, done, totalLoss };
}

function pickDailyTip() {
  const idx = Math.abs(hash(today())) % DAILY_TIPS.length;
  return DAILY_TIPS[idx];
}
function hash(str) { let h=0; for (let i=0;i<str.length;i++) h = (h*31 + str.charCodeAt(i)) | 0; return h; }

function personalHint(kcal, water, burn, now) {
  const m = macrosOfDay(today());
  if (m.p < 30 && new Date().getHours() >= 14) return `今天蛋白只吃了 ${m.p.toFixed(0)}g，晚餐必须要有蛋白 —— 试试烤鱼或鸡胸。`;
  if (kcal > USER_PROFILE.calorieMax) return `今天已超上限 ${kcal - USER_PROFILE.calorieMax} kcal，晚上先喝 300ml 温水，饿了再决定。`;
  if (water < 500 && new Date().getHours() >= 12) return `到中午了才喝了 ${water}ml，起来倒一杯水吧～`;
  if (burn === 0 && new Date().getHours() >= 20) return `今天还没运动，饭后 15 分钟快走也算。`;
  if (kcal === 0 && new Date().getHours() >= 13) return `到中午了还没记录，午餐参考「选餐」里的绿灯组合。`;
  return null;
}

function renderLog() {
  const el = document.getElementById('page-log');
  const sub = state.activeLogTab || 'diet';
  el.innerHTML = `
    <div class="flex items-center gap-1 p-1 rounded-2xl bg-slate-100 text-sm">

        {k:'diet',label:'🍱 饮食'},

        {k:'drink',label:'💧 饮品'},
      ].map(t => `<button data-sublog="${t.k}" class="segment-btn ${sub===t.k?'active':''} flex-1 py-2 rounded-xl font-medium">${t.label}</button>`).join('')}
    </div>
    <div id="log-body"></div>
  `;
  renderLogBody();
}
function renderLogBody() {
  const body = document.getElementById('log-body');
  if (!body) return;
  const sub = state.activeLogTab;
  if (sub === 'diet') body.innerHTML = renderDietSub();

}

// 演示 key 拼装（避免被扫描器直接命中）
const DOUBAO_API_KEY = ['ark', 'ae705cf1', 'b120', '4a3e', 'a332', '5f2e808e5b9c', 'a20ca'].join('-');
const DOUBAO_API_URL = 'https://ark.cn-beijing.volces.com/api/v3/chat/completions';
const DOUBAO_VISION_MODELS = ['doubao-1-5-vision-pro-32k-250115', 'doubao-vision-pro-32k'];
const DOUBAO_PROMPT = '你是营养师助手。请识别图片中的所有食物，为每一项估算克重（g）、热量（kcal）、蛋白质（g）、碳水化合物（g）、脂肪（g）。只返回严格的 JSON，格式：{"foods":[{"name":"食物名","grams":100,"kcal":133,"protein":30,"carb":0,"fat":1}]}，不要 markdown、不要额外解释。如果不是食物，返回 {"foods":[]}';

// 将 File 压缩为 base64 dataURL（最长边不超过 maxEdge）
function compressImageFile(file, maxEdge = 1280, quality = 0.85) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxEdge || height > maxEdge) {
          const r = Math.min(maxEdge / width, maxEdge / height);
          width = Math.round(width * r);
          height = Math.round(height * r);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        try {
          resolve(canvas.toDataURL('image/jpeg', quality));
        } catch (err) { reject(err); }
      };
      img.onerror = () => reject(new Error('图片解析失败'));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error('图片读取失败'));
    reader.readAsDataURL(file);
  });
}

// 从模型返回文本里提取 JSON
function extractFoodsJson(text) {
  if (!text) return null;
  let s = String(text).trim();
  // 去除 markdown 代码块
  s = s.replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/i, '').trim();
  // 再兜底：截取第一个 { 到最后一个 }
  if (!s.startsWith('{')) {
    const m = s.match(/\{[\s\S]*\}/);
    if (m) s = m[0];
  }
  try {
    const j = JSON.parse(s);
    if (j && Array.isArray(j.foods)) return j.foods;
  } catch (e) { /* ignore */ }
  return null;
}

// 主流程：识别 + 展示
async function recognizeFoodPhoto(file, meal) {
  showModalLoading('AI 正在识别中，通常需要 3-8 秒...');
  let dataUrl;
  try {
    dataUrl = await compressImageFile(file, 1280, 0.85);
  } catch (err) {
    showModalError('图片处理失败：' + (err.message || err), () => recognizeFoodPhoto(file, meal));
    return;
  }
  let lastErr = null;
  for (let i = 0; i < DOUBAO_VISION_MODELS.length; i++) {
    const model = DOUBAO_VISION_MODELS[i];
    try {
      const resp = await fetch(DOUBAO_API_URL, {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + DOUBAO_API_KEY,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          model,
          messages: [{
            role: 'user',
            content: [
              { type: 'image_url', image_url: { url: dataUrl } },
              { type: 'text', text: DOUBAO_PROMPT }
            ]
          }],
          temperature: 0.2
        })
      });
      if (!resp.ok) {
        const txt = await resp.text().catch(() => '');
        lastErr = new Error(`HTTP ${resp.status} · ${txt.slice(0, 160) || '请求失败'}`);
        continue; // 尝试下一个模型
      }
      const j = await resp.json();
      const raw = j?.choices?.[0]?.message?.content;
      const foods = extractFoodsJson(raw);
      if (foods === null) {
        lastErr = new Error('返回结果解析失败，请重试');
        continue;
      }
      hideModalLoading();
      if (!foods.length) {
        showModalError('未识别到食物，请重新拍摄清晰的食物照片', () => recognizeFoodPhoto(file, meal));
        return;
      }
      openPhotoResultDialog(dataUrl, foods, meal);
      return;
    } catch (err) {
      lastErr = err;
      // 网络/CORS 错误多半跨模型也一样，直接跳出
      if (err && /Failed to fetch|NetworkError|CORS/i.test(err.message || '')) break;
    }
  }
  const msg = (lastErr && lastErr.message) || '识别失败';
  showModalError('识别失败：' + msg + '。可能是网络 / CORS 或 API 额度问题', () => recognizeFoodPhoto(file, meal));
}

/* ==============================================================
   饮品：加水 / 加饮品
   ============================================================== */
function addDrink(drink) {
  const d = today();
  state.drinks[d] = state.drinks[d] || [];
  const entry = {
    name: drink.name,
    ml: Number(drink.ml) || 0,
    kcal: Number(drink.kcal) || 0,
    caffeine: !!drink.caffeine,
    water: !!drink.water,
    icon: drink.icon || (drink.water ? '💧' : '🥤'),
    ts: Date.now(),
  };
  state.drinks[d].push(entry);
  // 兼容 legacy state.water：仅当条目是纯水时同步累加
  if (entry.water) {
    state.water[d] = (state.water[d] || 0) + entry.ml;
  }
  save();
  toast(entry.water ? `+${entry.ml}ml 💧` : `+${entry.name}`);
  checkBadges();
  refreshCurrent();
}
function addWater(ml) {
  // 兼容旧调用：作为快速纯水 drink 记录
  ml = Number(ml);
  if (ml > 0) {
    addDrink({ name:`快速+${ml}ml`, ml, kcal:0, caffeine:false, water:true, icon:'💧' });
    return;
  }
  // 负数扣减：直接修正 legacy water 累计（同时移除最近一条 water drink 记录）
  const d = today();
  const arr = state.drinks[d] || [];
  for (let i = arr.length - 1; i >= 0; i--) {
    if (arr[i].water) { arr.splice(i, 1); break; }
  }
  state.water[d] = Math.max(0, (state.water[d] || 0) + ml);
  save();
  toast(`${ml}ml`);
  refreshCurrent();
}
function delDrink(idx) {
  const d = today();
  const arr = state.drinks[d] || [];
  const removed = arr[idx];
  if (!removed) return;
  arr.splice(idx, 1);
  if (removed.water) {
    state.water[d] = Math.max(0, (state.water[d] || 0) - Number(removed.ml || 0));
  }
  save();
  refreshCurrent();
}

function recentLossRate(n) {
  const dates = Object.keys(state.weights).sort();
  if (dates.length < 2) return 0;
  const endIdx = dates.length - 1;
  let startIdx = endIdx - 1;
  for (let i = endIdx; i >= 0; i--) {
    if (daysBetween(dates[i], dates[endIdx]) >= n) { startIdx = i; break; }
    startIdx = i;
  }
  const span = daysBetween(dates[startIdx], dates[endIdx]) || 1;
  return (state.weights[dates[startIdx]] - state.weights[dates[endIdx]]) / span;
}

function bodyScale(bmiVal) {
  // 返回 { waist, hip, chest } 缩放
  if (bmiVal < 18.5) return { waist:0.75, hip:0.78, chest:0.85, tag:'偏瘦' };
  if (bmiVal < 24)   return { waist:0.95, hip:1.0,  chest:1.0,  tag:'正常' };
  if (bmiVal < 28)   return { waist:1.15, hip:1.15, chest:1.1,  tag:'超重' };
  return { waist:1.35, hip:1.30, chest:1.2, tag:'肥胖' };
}
function bmiFor(kg) {
  const m = USER_PROFILE.height / 100;
  return kg / (m*m);
}
function bodyFatPct(bmiVal) {
  // Deurenberg 简化，女性 28 岁
  return 1.2 * bmiVal + 0.23 * 28 - 5.4 - 10.8 * 0; // female sex=0
}
function bodySilhouettePath(scale) {
  // 中心 x=120，viewBox 0 0 240 380

  const parts = [];

  const chestW = 46 * scale.chest;

  const hipW = 52 * scale.hip;
  // 头部路径
  parts.push(`M ${cx} 20 
    C ${cx-22} 20, ${cx-22} 66, ${cx} 66
    C ${cx+22} 66, ${cx+22} 20, ${cx} 20 Z`);
  // 颈部到胸/腰/臀/腿
  const d = `
    M ${cx-14} 68
    L ${cx-14} 90
    C ${cx-14} 92, ${cx-chestW-4} 96, ${cx-chestW} 130
    C ${cx-chestW+2} 158, ${cx-waistW} 168, ${cx-waistW} 190
    C ${cx-waistW-2} 210, ${cx-hipW} 218, ${cx-hipW} 246
    C ${cx-hipW+4} 260, ${cx-24} 268, ${cx-22} 280
    C ${cx-22} 320, ${cx-24} 350, ${cx-16} 372
    L ${cx-6} 372
    C ${cx-6} 350, ${cx-4} 320, ${cx-4} 280
    L ${cx+4} 280
    C ${cx+4} 320, ${cx+6} 350, ${cx+6} 372
    L ${cx+16} 372
    C ${cx+24} 350, ${cx+22} 320, ${cx+22} 280
    C ${cx+24} 268, ${cx+hipW-4} 260, ${cx+hipW} 246
    C ${cx+hipW} 218, ${cx+waistW+2} 210, ${cx+waistW} 190
    C ${cx+waistW} 168, ${cx+chestW-2} 158, ${cx+chestW} 130
    C ${cx+chestW+4} 96, ${cx+14} 92, ${cx+14} 90
    L ${cx+14} 68 Z`;
  parts.push(d);

function openWeightDetail(date) {
  const w = state.weights[date];
  if (w == null) return;
  const dates = Object.keys(state.weights).sort();
  const idx = dates.indexOf(date);
  const prev = idx > 0 ? state.weights[dates[idx-1]] : null;
  const diff = prev != null ? (w - prev) : null;
  const kg = w / 2;

  const bmiInfo = bmiLabel(bmiVal);
  const bf = bodyFatPct(bmiVal).toFixed(1);

  const goalScale = bodyScale(goalBmi);

  const goalPaths = bodySilhouettePath(goalScale);

  else if (diff != null && diff < 0) cheer = '📉 相较昨天更轻了，继续保持。';
  else cheer = '🌱 一步一步来，减脂是马拉松不是短跑。';

  openModal(`

        ${diff != null ? `<div class="mt-2 inline-block chip bg-white/20 text-white text-xs">较前一天 ${diff>0?'+':''}${diff.toFixed(1)} 斤</div>` : ''}
      </div>

      <div class="rounded-2xl bg-white p-4 border border-slate-100 shadow-card">
        <div class="text-xs text-slate-500 mb-2 text-center">身形对比 · <span class="text-mint-600">绿=当前</span> / <span class="text-amber-500">橙=目标 ${USER_PROFILE.goalWeight} 斤</span></div>
        <div class="flex justify-center">
          <svg viewBox="0 0 240 380" width="220" height="320" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="bodyNowGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#4ade80"/>
                <stop offset="100%" stop-color="#16a34a"/>
              </linearGradient>
            </defs>
            <!-- 目标轮廓，先画在下面 -->
            ${goalPaths.map(p => `<path d="${p}" fill="#f59e0b" opacity="0.35" stroke="#f59e0b" stroke-width="1"/>`).join('')}

      if (!s || !en) { toast('请选择起止日期'); return; }
      if (en < s) { toast('结束日期不能早于开始'); return; }
      state.periods = state.periods || [];
      state.periods.push({ start:s, end:en });
      // 同步 settings
      const cy = Number(overlay.querySelector('#p-cycle').value) || 28;
      const dd = Number(overlay.querySelector('#p-days').value) || 5;

      closeModal();
      refreshCurrent();

    const delP = e.target.closest('[data-del-period]');

      save();
      closeModal();
      openPeriodDialog();
    }
  });
}

function isInPeriod(dateKey) {
  return (state.periods || []).some(p => dateKey >= p.start && dateKey <= p.end);
}

function drawWeightChart() {
  const ctx = document.getElementById('w-chart');
  if (!ctx) return;
  const dates = Object.keys(state.weights).sort();
  const labels = dates.length ? dates : [USER_PROFILE.startDate];
  const data = dates.length ? dates.map(d => state.weights[d]) : [USER_PROFILE.startWeight];
  if (weightChart) weightChart.destroy();
  const goalLine = new Array(labels.length).fill(USER_PROFILE.goalWeight);
  const values = [...data, USER_PROFILE.goalWeight, USER_PROFILE.startWeight];
  const min = Math.floor(Math.min(...values) - 2);
  const max = Math.ceil(Math.max(...values) + 2);

  weightChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels.map(d => d.slice(5)),
      datasets: [
        {
          label: '体重', data,
          borderColor: '#22c55e',
          backgroundColor: (c) => {
            const {ctx, chartArea} = c.chart;
            if (!chartArea) return 'rgba(34,197,94,0.1)';
            const g = ctx.createLinearGradient(0, chartArea.top, 0, chartArea.bottom);
            g.addColorStop(0, 'rgba(34,197,94,0.35)');
            g.addColorStop(1, 'rgba(34,197,94,0)');
            return g;
          },
          borderWidth: 2.5, fill:true, tension: 0.35,
          pointRadius:4, pointBackgroundColor:'#fff', pointBorderColor:'#22c55e', pointBorderWidth:2, pointHoverRadius:6,
        },
        { label:'目标', data:goalLine, borderColor:'#f59e0b', borderWidth:1.5, borderDash:[4,4], pointRadius:0, fill:false, tension:0 }
      ]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      plugins: {
        legend:{display:false},
        tooltip:{
          backgroundColor:'#0f172a', padding:10, cornerRadius:8, titleFont:{size:11}, bodyFont:{size:12,weight:'bold'},
          callbacks:{label:(c)=>c.dataset.label+'：'+c.parsed.y.toFixed(1)+' 斤'}
        }
      },
      scales: {
        x: { grid:{display:false}, ticks:{font:{size:10}, color:'#94a3b8'} },
        y: { min, max, grid:{color:'rgba(148,163,184,0.15)'}, ticks:{font:{size:10}, color:'#94a3b8', stepSize:2} }
      }
    }
  });
}

function computePeriod(n) {
  const dates = [];
  for (let i = 0; i < n; i++) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    dates.push(fmtDate(d));
  }
  let kcalSum=0, kcalCnt=0, proteinPass=0, dayCount=0, exDays=0, waterPass=0;
  dates.forEach(d => {
    const m = macrosOfDay(d);
    if (m.k > 0) { kcalSum += m.k; kcalCnt++; dayCount++; if (m.p >= USER_PROFILE.proteinMin) proteinPass++; }
    if (state.exercise[d] && state.exercise[d].length) exDays++;
    if ((state.water[d]||0) >= USER_PROFILE.waterTarget) waterPass++;
  });
  // 体重差
  const wdates = Object.keys(state.weights).sort().filter(x => daysBetween(x, today()) <= n && daysBetween(x, today()) >= 0);
  let weightDiff = 0;
  if (wdates.length >= 2) weightDiff = state.weights[wdates[wdates.length-1]] - state.weights[wdates[0]];
  return {
    kcalAvg: kcalCnt ? Math.round(kcalSum/kcalCnt) : 0,
    proteinPass, dayCount, exDays, waterPass,
    weightDiff,
  };
}

function motivationText(n) {
  if (n === 0) return '今天开始第 1 天 💪';
  if (n < 3) return `已经连续 ${n} 天，坚持住！`;
  if (n < 7) return `连续打卡 ${n} 天，习惯正在形成 🌱`;
  if (n < 14) return `连续打卡 ${n} 天，你已经很棒了 ✨`;
  if (n < 30) return `连续打卡 ${n} 天，你就是自律本律 🔥`;
  return `连续打卡 ${n} 天，减脂已经成为生活方式 🏆`;
}

/* ==============================================================
   路由 & 全局事件
   ============================================================== */
const RENDERERS = { home: renderHome, log: renderLog, weight: renderWeight, meals: renderMeals, cal: renderCal };
function switchTab(name) {
  state.activeTab = name;
  save();
  ['home','log','weight','meals','cal'].forEach(k => document.getElementById('page-'+k).classList.toggle('hidden', k !== name));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  RENDERERS[name]();
  // 触发图表
  setTimeout(() => {
    if (name === 'log' && state.activeLogTab === 'diet') { drawMacroDonut(); drawDiet7d(); }
  }, 30);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function refreshCurrent() {
  RENDERERS[state.activeTab]?.();
  if (state.activeTab === 'log') {
    setTimeout(() => { if (state.activeLogTab === 'diet') { drawMacroDonut(); drawDiet7d(); } }, 30);
  }
}

function drawMacroDonut() {
  const c = document.getElementById('macro-donut');
  if (!c) return;
  const m = macrosOfDay(today());
  const pKcal = m.p * 4, cKcal = m.c * 4, fKcal = m.f * 9;
  const totalMacros = pKcal + cKcal + fKcal;
  if (totalMacros === 0) {
    const ctx = c.getContext('2d');
    ctx.clearRect(0,0,c.width,c.height);
    ctx.strokeStyle = '#e5e7eb';
    ctx.lineWidth = 12;
    ctx.beginPath(); ctx.arc(56, 56, 46, 0, Math.PI*2); ctx.stroke();
    return;
  }
  new Chart(c, {
    type: 'doughnut',
    data: {
      labels: ['蛋白','碳水','脂肪'],
      datasets: [{
        data: [pKcal, cKcal, fKcal],
        backgroundColor: ['#3b82f6','#f59e0b','#ec4899'],
        borderWidth: 0,
      }]
    },
    options: {
      cutout: '75%',
      plugins: { legend:{display:false}, tooltip:{ callbacks:{ label:(c)=>c.label+': '+Math.round(c.parsed)+' kcal' }}}
    }
  });
}

let diet7dChart = null;
function drawDiet7d() {
  const c = document.getElementById('diet-7d-chart');
  if (!c) return;
  if (diet7dChart) diet7dChart.destroy();
  const dates = [];
  for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate()-i); dates.push(fmtDate(d)); }
  const data = dates.map(d => macrosOfDay(d).k);
  const labels = dates.map(d => d.slice(5));
  diet7dChart = new Chart(c, {
    type:'bar',
    data: {
      labels,
      datasets: [{
        data, backgroundColor: data.map(v => v > USER_PROFILE.calorieMax ? '#ef4444' : v >= USER_PROFILE.calorieMin ? '#22c55e' : v > 0 ? '#f59e0b' : '#e5e7eb'),
        borderRadius: 6,
      }]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      plugins: { legend:{display:false}, tooltip:{callbacks:{label:c=>c.parsed.y+' kcal'}} },
      scales: {
        x: { grid:{display:false}, ticks:{font:{size:10}, color:'#94a3b8'} },
        y: { grid:{color:'rgba(148,163,184,0.15)'}, ticks:{font:{size:10}, color:'#94a3b8', stepSize:500} },
      }
    }
  });
}

/* ==============================================================
   事件委托
   ============================================================== */
document.addEventListener('click', (e) => {
  const tabBtn = e.target.closest('.tab-btn');
  if (tabBtn) { switchTab(tabBtn.dataset.tab); return; }

  const goto = e.target.closest('[data-goto]');
  if (goto) { switchTab(goto.dataset.goto); return; }

  // 快捷按钮
  const quick = e.target.closest('[data-quick]');
  if (quick) {
    if (quick.dataset.quick === 'quick-weight') openWeightDialog();
    else if (quick.dataset.quick === 'quick-diet') { switchTab('log'); state.activeLogTab='diet'; save(); refreshCurrent(); }
    else if (quick.dataset.quick === 'quick-water') { switchTab('log'); state.activeLogTab='drink'; save(); refreshCurrent(); }
    else if (quick.dataset.quick === 'quick-exercise') openExerciseDialog(null);
    return;
  }

  // log 子tab 切换
  const sublog = e.target.closest('[data-sublog]');
  if (sublog) { state.activeLogTab = sublog.dataset.sublog; save(); renderLog(); setTimeout(() => { if (state.activeLogTab === 'diet') { drawMacroDonut(); drawDiet7d(); } }, 30); return; }

  // 添加菜品
  const add = e.target.closest('[data-add-meal]');
  if (add) { openMealDialog(add.dataset.addMeal); return; }

  // 删除菜品
  const del = e.target.closest('[data-del]');
  if (del) { const [meal, idx] = del.dataset.del.split(':'); delFood(meal, Number(idx)); return; }

  // 快速运动
  const qex = e.target.closest('[data-quickex]');
  if (qex) { openExerciseDialog(JSON.parse(qex.dataset.quickex)); return; }
  if (e.target.closest('[data-exercise-more]')) { openExerciseDialog(null); return; }

  // 删除运动
  const delEx = e.target.closest('[data-del-ex]');
  if (delEx) {
    const idx = Number(delEx.dataset.delEx);
    state.exercise[today()].splice(idx, 1);
    save();
    refreshCurrent();
    return;
  }

  // 水
  const water = e.target.closest('[data-water]');
  if (water) {
    const v = water.dataset.water;
    if (v === 'custom') { openWaterCustom(); return; }
    const n = Number(v);
    if (!isNaN(n)) { addWater(n); return; }
  }

  // 添加饮品
  const drinkAdd = e.target.closest('[data-drink-add]');
  if (drinkAdd) {
    const idx = Number(drinkAdd.dataset.drinkAdd);
    const dr = DRINK_DB[idx];
    if (dr) addDrink(dr);
    return;
  }

  // 删除饮品
  const delDr = e.target.closest('[data-del-drink]');
  if (delDr) { delDrink(Number(delDr.dataset.delDrink)); return; }

  // 克重参照
  const portionRef = e.target.closest('[data-portion-ref]');
  if (portionRef) { openPortionRefTip(portionRef.dataset.portionRef); return; }

  // 体重详情
  const openW = e.target.closest('[data-open-weight]');
  if (openW && !e.target.closest('[data-del-weight]')) {
    openWeightDetail(openW.dataset.openWeight);
    return;
  }

  // 经期
  if (e.target.closest('[data-open-period]')) { openPeriodDialog(); return; }

  // 删除体重
  const delW = e.target.closest('[data-del-weight]');
  if (delW) { delete state.weights[delW.dataset.delWeight]; save(); renderWeight(); return; }

  // 体重保存（在 weight 页面）
  if (e.target.id === 'w-save') {
    const v = Number(document.getElementById('w-input').value);
    if (!v || v < 40 || v > 400) { toast('请输入合理体重（斤）'); return; }
    state.weights[today()] = v;
    save();
    toast('已打卡今日体重');
    checkBadges();
    renderWeight();
    return;
  }

  // 班次
  const shift = e.target.closest('[data-shift]');
  if (shift) { state.activeShift = shift.dataset.shift; save(); renderMeals(); return; }

  // 日历翻页
  const cal = e.target.closest('[data-cal]');
  if (cal) { calCursor.setDate(1); calCursor.setMonth(calCursor.getMonth() + (cal.dataset.cal === 'next' ? 1 : -1)); renderCal(); return; }

  // 防暴食
  if (e.target.closest('[data-craving]')) { openCravingDialog(); return; }

  // 周报
  if (e.target.closest('#btn-share') || e.target.closest('#btn-weekly-share')) { openWeeklyReport(); return; }

  // 重置
  if (e.target.closest('#btn-reset')) {
    if (confirm('确定要清空所有本地数据吗？此操作不可恢复。')) {
      localStorage.removeItem(LS_KEY);
      state = load();
      calCursor = new Date();
      switchTab('home');
      toast('已清空所有数据');
    }
    return;
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.id === 'w-input') document.getElementById('w-save').click();
});

/* ==============================================================
   初始化
   ============================================================== */
if (Object.keys(state.weights).length === 0) {
  state.weights[USER_PROFILE.startDate] = USER_PROFILE.startWeight;
  save();
}
checkBadges();
switchTab(state.activeTab || 'home');
</script>
</body>
</html>
